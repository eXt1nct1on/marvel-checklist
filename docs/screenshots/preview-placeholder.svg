<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <linearGradient id="marvelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="220" fill="#e23636" fill-opacity="0.08"/>
  <circle cx="1000" cy="350" r="260" fill="#0476f2" fill-opacity="0.08"/>

  <!-- Badge -->
  <rect x="475" y="70" width="250" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="2">MULTIVERSE TRACKER</text>

  <!-- Title -->
  <text x="600" y="165" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Marvel &amp; DC Movie Checklist</text>
  <text x="600" y="210" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-anchor="middle">Curated Watch Orders • Doomsday Countdown • Zero-Dependency PWA</text>

  <!-- Metric Badges -->
  <g transform="translate(260, 260)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#161f36" stroke="#242f49" stroke-width="1.5"/>
    <text x="100" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">BEFORE DOOMSDAY</text>
    <text x="100" y="85" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">15 / 15</text>
    <text x="100" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Official Disney+ Order</text>

    <!-- Box 2 -->
    <rect x="240" y="0" width="200" height="120" rx="12" fill="#161f36" stroke="#242f49" stroke-width="1.5"/>
    <text x="340" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MARVEL UNIVERSE</text>
    <text x="340" y="85" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#marvelGrad)" text-anchor="middle">54 Titles</text>
    <text x="340" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">MCU &amp; Fox X-Men</text>

    <!-- Box 3 -->
    <rect x="480" y="0" width="200" height="120" rx="12" fill="#161f36" stroke="#242f49" stroke-width="1.5"/>
    <text x="580" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DC UNIVERSE</text>
    <text x="580" y="85" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#dcGrad)" text-anchor="middle">24 Titles</text>
    <text x="580" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">DCEU, DCU, Elseworlds</text>
  </g>

  <!-- Bottom banner -->
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">100% Client-Side • LocalStorage Persistence • Multi-Profile Support</text>
</svg>
