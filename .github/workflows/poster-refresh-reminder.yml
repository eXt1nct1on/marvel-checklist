name: Poster Refresh Reminder

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of every month
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-poster-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check git log dates
          
      - name: Check poster age and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            
            // Get timestamp of last modification of js/posters.js
            let timestamp;
            try {
              const output = execSync('git log -1 --format="%at" -- js/posters.js');
              timestamp = parseInt(output.toString().trim(), 10);
            } catch (err) {
              console.log('Could not determine git age of js/posters.js');
              return;
            }
            
            if (isNaN(timestamp)) return;
            
            const nowSeconds = Math.floor(Date.now() / 1000);
            const daysOld = (nowSeconds - timestamp) / (60 * 60 * 24);
            
            console.log(`posters.js is ${daysOld.toFixed(1)} days old.`);
            
            if (daysOld > 150) {
              const title = 'Refresh TMDB poster data';
              
              // Check if an open issue already exists
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                creator: 'app/github-actions'
              });
              
              const existingIssue = issues.find(i => i.title === title);
              
              const body = `It has been over 150 days (${daysOld.toFixed(0)} days) since the TMDB poster data was last refreshed. Per TMDB API terms of use, cached data should be refreshed every 6 months.

Please run \`node scripts/fetch-posters.mjs --refresh\` locally and commit the updated \`js/posters.js\`.`;

              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: "Monthly reminder: " + body
                });
                console.log(`Commented on existing issue #${existingIssue.number}`);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['maintenance']
                });
                console.log('Created new issue.');
              }
            }
